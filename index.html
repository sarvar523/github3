<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flexbox Display Example</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="display-options">
      <div class="option">Display:flex;</div>
      <div class="option">Display:none;</div>
      <div class="option">Display:block;</div>
      <div class="option">Display:inline;</div>
    </div>

    <div class="images-row">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/62/CSS3_logo.svg" alt="CSS" class="img-small" />
      <img src="https://i.ytimg.com/vi/JJSoEo8JSnc/maxresdefault.jpg" alt="Flexbox" class="img-small" />
    </div>

    <div class="center-box">FlexBox</div>

    <div class="description-row">
      <div class="desc">
        CSS Flexbox — это модуль для создания сложных макетов за счёт правильного позиционирования элементов.
      </div>
      <div class="desc">
        Flexbox, веб-дизайн jarayonini soddalashtiradi va elementlarni moslashuvchan joylashtirishga yordam beradi.
      </div>
    </div>
  </div>
</body>
</html>
